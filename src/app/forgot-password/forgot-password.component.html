<div class="row mt-7" *ngIf="isLoading">
  <app-is-loading></app-is-loading>
</div>
<div *ngIf="!isLoading">
  <app-dynamic-content
    type="HEADER"
    version="{{ publicConfig.controlPanelSettings?.headerVersion }}"
  ></app-dynamic-content>
  <div class="page page-center vh-100">
    <div class="container container-tight py-4 my-6">
      <div
        class="text-center mb-4"
        *ngIf="!isLoading && !publicConfig.controlPanelSettings?.headerContent"
      >
        <a [routerLink]="['/']" class="navbar-brand navbar-brand-autodark"
          ><img [src]="organizationLogoUrl" height="36" alt=""
        /></a>
      </div>
      <form
        class="card card-md"
        (ngSubmit)="f.form.valid && onForgotClick()"
        #f="ngForm"
      >
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4">Forgot password</h2>
          <p class="text-muted mb-4">
            Enter your email address/mobile or registration number and your
            password will be reset and emailed to you.
          </p>
          <div class="mb-3">
            <label class="form-label my-1">Username</label>
            <input
              name="username"
              type="text"
              class="form-control"
              placeholder="Enter email address/mobile or registration number."
              [(ngModel)]="forgot.username"
              #username="ngModel"
              [ngClass]="{
                'is-invalid':
                  (f.submitted || username.touched) && username.invalid
              }"
              ngModel
              maxlength="255"
              required
              username
            />
            <div
              *ngIf="username.invalid && (f.submitted || username.touched)"
              class="invalid-feedback text-break"
            >
              <div *ngIf="username.errors.required">
                Please enter a valid email address/mobile or registration
                number.
              </div>
            </div>
          </div>
          <div class="form-footer">
            <button
              type="submit"
              class="btn btn-primary w-100"
              [disabled]="isLoading"
            >
              <i
                *ngIf="isLoading"
                class="spinner-border spinner-border-sm me-1"
              ></i>
              <i class="fas fa-cog pe-1" *ngIf="!isLoading"></i>
              Send me new password
            </button>
            <app-footer></app-footer>
          </div>
        </div>
      </form>
      <div class="text-center text-muted mt-3">
        Forget it, <a [routerLink]="['/login']">send me back</a> to the sign in
        screen.
      </div>
    </div>
  </div>
</div>
