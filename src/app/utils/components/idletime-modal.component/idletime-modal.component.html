<div class="modal-content">
  <div class="container-fluid p-0">
    <div class="modal-header">
      <h5 class="modal-title">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="icon icon-tabler icon-tabler-alert-circle me-2"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
          <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"></path>
          <path d="M12 8v4"></path>
          <path d="M12 16h.01"></path>
        </svg>
        Session Timeout!
      </h5>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="modal"
        aria-label="Close"
        (click)="bsModalRef.hide()"
        aria-hidden="true"
      >
        &times;
      </button>
    </div>
    <div class="modal-body">
      <p class="text-break">
        You're being timed out due to inactivity. To ensure the safety of your
        data, the application will logout automatically in
        <span class="label label-warning">{{ countdown }}</span> seconds.
      </p>
      <p>
        Please press any key or click anywhere to stay logged-in.
      </p>
      <progressbar
        max="120"
        [value]="countdown"
        type="warning"
        [striped]="true"
        >{{ countdown }}</progressbar
      >
    </div>
  </div>
</div>
