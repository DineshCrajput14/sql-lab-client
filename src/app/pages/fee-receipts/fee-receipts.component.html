<div class="page-header d-print-none mt-1">
  <div class="container-xl p-0 pb-2">
    <div class="row g-2 align-items-center">
      <div class="col">
        <h2 class="page-title">Rent Receipts</h2>
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid p-0">
    <form #f="ngForm" (ngSubmit)="getFeeReceipts()" autocomplete="off">
      <div class="row">
        <div class="col-sm-6 col-md-4 col-lg-3 mb-2">
          <div class="form-group row">
            <label
              class="col-sm-4 text-end col-form-label text-nowrap"
              for="searchProperty"
              >Property:</label
            >
            <div class="col-sm-8">
              <select
                class="form-select"
                name="searchProperty"
                id="searchProperty"
                [(ngModel)]="search.propertyId"
                (change)="onPropertyChange()"
              >
                <option [ngValue]="undefined" selected>All</option>
                <option
                  [ngValue]="property.id"
                  *ngFor="let property of propertiesList"
                >
                  {{ property.name }}
                </option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-4 col-lg-3 mb-2">
          <div class="form-group row">
            <label
              class="col-sm-4 text-end col-form-label text-nowrap"
              for="searchBuilding"
              >Block:</label
            >
            <div class="col-sm-8">
              <select
                class="form-select"
                name="searchBuilding"
                id="searchBuilding"
                [(ngModel)]="search.buildingId"
                (change)="onBuildingChange()"
                [disabled]="!search.propertyId"
              >
                <option [ngValue]="undefined" selected>All</option>
                <option
                  [ngValue]="building.id"
                  *ngFor="let building of buildingsList"
                >
                  {{ building.name }}
                </option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-4 col-lg-3 mb-2">
          <div class="form-group row">
            <label
              class="col-sm-4 text-end col-form-label text-nowrap"
              for="searchUnit"
              >Unit:</label
            >
            <div class="col-sm-8">
              <select
                class="form-select"
                name="searchUnit"
                id="searchUnit"
                [(ngModel)]="search.unitId"
                [disabled]="!search.propertyId"
              >
                <option [ngValue]="undefined" selected>All</option>
                <option [ngValue]="unit.id" *ngFor="let unit of unitsList">
                  {{ unit.unitNo }}
                </option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-4 col-lg-3 mb-2">
          <div class="form-group row">
            <label
              class="col-sm-4 text-end col-form-label required text-nowrap"
              for="fromDate"
              >From Date:</label
            >
            <div class="col-sm-8">
              <input
                type="text"
                class="form-control"
                name="fromDate"
                id="fromDate"
                [(ngModel)]="search.fromDate"
                placeholder="DD-MM-YYYY"
                #fromDate="ngModel"
                bsDatepicker
                autocomplete="off"
                [outsideClick]="true"
                [container]="'body'"
                [bsConfig]="{
                  dateInputFormat: 'DD-MM-YYYY',
                  isAnimated: true,
                  containerClass: 'theme-dark-blue',
                  returnFocusToInput: true,
                  showWeekNumbers: false
                }"
              />
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-4 col-lg-3 mb-2">
          <div class="form-group row">
            <label
              class="col-sm-4 text-end col-form-label required text-nowrap"
              for="toDate"
              >To Date:</label
            >
            <div class="col-sm-8">
              <input
                type="text"
                class="form-control"
                name="toDate"
                id="toDate"
                [(ngModel)]="search.toDate"
                [minDate]="search.fromDate"
                placeholder="DD-MM-YYYY"
                #toDate="ngModel"
                bsDatepicker
                autocomplete="off"
                [outsideClick]="true"
                [container]="'body'"
                [bsConfig]="{
                  dateInputFormat: 'DD-MM-YYYY',
                  isAnimated: true,
                  containerClass: 'theme-dark-blue',
                  returnFocusToInput: true,
                  showWeekNumbers: false
                }"
              />
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-4 col-lg-3 mb-2">
          <div class="form-group row">
            <label
              class="col-sm-4 text-end col-form-label ps-0 text-nowrap"
              for="searchOptions"
              >Search Option:</label
            >
            <div class="col-sm-8">
              <select
                class="form-select"
                name="searchOptions"
                id="searchOptions"
                [(ngModel)]="search.searchField"
              >
                <option
                  [value]="option.id"
                  *ngFor="let option of searchOptionsList"
                >
                  {{ option.name }}
                </option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-4 col-lg-3 mb-2">
          <div class="form-group row">
            <label
              class="col-sm-4 text-end col-form-label text-nowrap"
              for="searchText"
              >Search Text:</label
            >
            <div class="col-sm-8">
              <input
                type="text"
                class="form-control"
                name="searchText"
                id="searchText"
                placeholder="Enter search text"
                [(ngModel)]="search.keyword"
              />
            </div>
          </div>
        </div>
        <div class="col-auto ms-auto mb-2">
          <button class="btn btn-dark" type="submit" [disabled]="isLoading">
            <i
              *ngIf="isLoading"
              class="spinner-border spinner-border-sm me-1"
            ></i>
            <i *ngIf="!isLoading" class="fas fa-search pe-1"></i> Search
          </button>
        </div>
      </div>
      <div class="row mb-2">
        <div class="col-12">
          <small class="form-text text-muted">
            <strong>Note:</strong> Please select a record in the first grid to
            display the details in the second grid.
          </small>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-8 mb-2">
          <ag-grid-angular
            style="width: 100%; height: 52vh;"
            class="ag-theme-alpine"
            [enableCellTextSelection]="true"
            [columnDefs]="columnDefsReceipts"
            [rowData]="gridRowDataReceipts"
            [defaultColDef]="defaultColDef"
            [rowSelection]="'single'"
            (gridReady)="onReceiptGridReady($event)"
            (selectionChanged)="onReceiptSelectionChanged()"
            (firstDataRendered)="onReceiptFirstDataRendered($event)"
          >
          </ag-grid-angular>
          <div *ngIf="gridRowDataReceipts?.length" class="ms-1 fw-bold mt-1">
            <label>Total records: {{ gridRowDataReceipts.length }}</label>
          </div>
          <div class="row mt-2">
            <div class="col-12">
              <button
                type="button"
                class="btn btn-primary me-2"
                (click)="newFeeReceipt()"
                [disabled]="isLoading"
              >
                <i class="fas fa-money-check-alt pe-1"></i>
                New Rent Receipt
              </button>
              <button
                type="button"
                (click)="exportToCsv()"
                class="btn btn-secondary me-2"
                [disabled]="!gridRowDataReceipts || !gridRowDataReceipts.length"
              >
                <i class="fas fa-file-export pe-1"></i> Export
              </button>
            </div>
          </div>
        </div>
        <div class="col-sm-4 mb-2">
          <ag-grid-angular
            style="width: 100%; height: 52vh;"
            class="ag-theme-alpine"
            [enableCellTextSelection]="true"
            [columnDefs]="columnDefsDetails"
            [rowData]="gridRowDataDetails"
            [pinnedBottomRowData]="pinnedBottomRowDataDetails"
            [defaultColDef]="defaultColDef"
            (gridReady)="onDetailGridReady($event)"
          >
          </ag-grid-angular>
          <div *ngIf="gridRowDataDetails?.length" class="ms-1 fw-bold mt-1">
            <label>Total records: {{ gridRowDataDetails.length }}</label>
          </div>
        </div>
      </div>
    </form>
  </div>
</section>
