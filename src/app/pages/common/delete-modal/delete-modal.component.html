<div modalContainerBlur modalContentBorder class="modal-header">
  <button
    type="button"
    class="btn-close"
    data-bs-dismiss="modal"
    aria-label="Close"
    (click)="decline()"
    aria-hidden="true"
  >
    &times;
  </button>
</div>
<div class="modal-body text-center py-4">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="icon mb-2 text-danger icon-lg"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    stroke-width="2"
    stroke="currentColor"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
    <path
      d="M10.24 3.957l-8.422 14.06a1.989 1.989 0 0 0 1.7 2.983h16.845a1.989 1.989 0 0 0 1.7 -2.983l-8.423 -14.06a1.989 1.989 0 0 0 -3.4 0z"
    ></path>
    <path d="M12 9v4"></path>
    <path d="M12 17h.01"></path>
  </svg>
  <h3>Are you sure?</h3>
  <p class="text-muted text-wrap text-break" [innerHTML]="message"></p>
</div>
<div class="modal-footer">
  <div class="w-100">
    <div class="row">
      <div class="col">
        <a class="btn w-100" data-bs-dismiss="modal" (click)="decline()">
          Close
        </a>
      </div>
      <div class="col">
        <a
          class="btn btn-danger w-100"
          data-bs-dismiss="modal"
          (click)="confirm()"
        >
          Delete
          {{ name && name.length > 20 ? (name | slice: 0:20) + "..." : name }}
        </a>
      </div>
    </div>
  </div>
</div>
