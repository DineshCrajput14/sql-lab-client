<div modalContainerBlur modalContentBorder class="modal-header">
  <h5 class="modal-title">
    <span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="icon icon-tabler icon-tabler-adjustments-check me-1"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
        <path d="M4 10a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path>
        <path d="M6 4v4"></path>
        <path d="M6 12v8"></path>
        <path d="M13.823 15.176a2 2 0 1 0 -2.638 2.651"></path>
        <path d="M12 4v10"></path>
        <path d="M16 7a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path>
        <path d="M18 4v1"></path>
        <path d="M18 9v5"></path>
        <path d="M15 19l2 2l4 -4"></path>
      </svg> </span
    >Please confirm
  </h5>
  <button
    type="button"
    class="btn-close"
    data-bs-dismiss="modal"
    aria-label="Close"
    (click)="decline()"
  >
    &times;
  </button>
</div>
<div class="modal-body text-break">
  <p [innerHTML]="message"></p>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-primary"
    id="yesButtonConfirmModal"
    data-bs-dismiss="modal"
    (click)="confirm()"
  >
    <i class="fas fa-check pe-1"></i>Yes
  </button>
  <button
    type="button"
    class="btn"
    id="noButtonConfirmModal"
    data-bs-dismiss="modal"
    (click)="decline()"
  >
    <i class="fas fa-times pe-1"></i> No
  </button>
</div>
