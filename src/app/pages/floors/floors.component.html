<div class="page-header d-print-none mt-1">
  <div class="container-xl p-0 pb-2">
    <div class="row g-2 align-items-center">
      <div class="col">
        <h2 class="page-title">
          Floor
        </h2>
      </div>
    </div>
  </div>
</div>
<section class="content">
  <div class="container-fluid p-0">
    <div class="row" *ngIf="!(gridRowDataFloors || []).length && isLoading">
      <app-is-loading></app-is-loading>
    </div>
    <div class="row" *ngIf="!(gridRowDataFloors || []).length && !isLoading">
      <div class="col-12">
        <div class="d-flex justify-content-center align-items-center">
          <app-no-record-found-image
            [masterName]="'Floor'"
          ></app-no-record-found-image>
        </div>
      </div>
    </div>
    <div class="row" *ngIf="(gridRowDataFloors || []).length">
      <div class="col-12">
        <ag-grid-angular
          style="width: 100%; height: 63vh;"
          class="ag-theme-alpine"
          [enableCellTextSelection]="true"
          (gridReady)="onGridReady($event)"
          (filterChanged)="onFilterChanged($event)"
          [columnDefs]="gridColumnDefsFloors"
          [rowData]="gridRowDataFloors"
          [defaultColDef]="defaultColDef"
        >
        </ag-grid-angular>
        <div *ngIf="gridRowDataFloors?.length" class="ms-1 fw-bold">
          <label>Total records: {{ rowCount }}</label>
        </div>
      </div>
    </div>
    <div class="row p-1 my-2">
      <div class="col-12">
        <button
          type="button"
          (click)="newFloorModal()"
          class="btn btn-primary me-2"
        >
          <i class="fas fa-layer-group pe-1"></i> Add Floor
        </button>
      </div>
    </div>
  </div>
</section>
