<div class="modal-content">
  <div class="container-fluid p-0">
    <form #f="ngForm" (ngSubmit)="f.form.valid && save()">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fa fa-md fas fa-building pe-1"></i>
          {{ formState === "EDIT" ? "Edit" : "New" }} Property
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
          [disabled]="isLoading"
          (click)="cancel()"
          aria-hidden="true"
        >
          &times;
        </button>
      </div>
      <div class="modal-body">
        <div class="row" [hidden]="isLoading">
          <div class="col-12 mb-3">
            <div class="form-group">
              <label class="form-label required" for="propertyName"
                >Property Name:</label
              >
              <input
                type="text"
                class="form-control"
                name="propertyName"
                id="propertyName"
                [ngClass]="{
                  'is-invalid':
                    propertyName.invalid &&
                    (f.submitted || propertyName.touched)
                }"
                [(ngModel)]="property.name"
                placeholder="Enter property name"
                required
                #propertyName="ngModel"
                maxlength="255"
                ngModel
              />
              <div
                *ngIf="
                  propertyName.invalid && (f.submitted || propertyName.touched)
                "
                class="invalid-feedback text-break"
              >
                <div *ngIf="propertyName.errors?.required">
                  Please enter a valid property name.
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 mb-3">
            <div class="form-group">
              <label class="form-label" for="address">Address:</label>
              <input
                type="text"
                class="form-control"
                name="address"
                id="address"
                [(ngModel)]="property.address"
                placeholder="Enter address"
              />
            </div>
          </div>
          <div class="col-sm-4 mb-3">
            <div class="form-group">
              <label class="form-label required" for="country">Country:</label>
              <select
                class="form-select"
                name="country"
                id="country"
                (change)="onChangeCountry()"
                [(ngModel)]="property.countryId"
                [ngClass]="{
                  'is-invalid':
                    country.invalid && (f.submitted || country.touched)
                }"
                required
                #country="ngModel"
                ngModel
              >
                <option [ngValue]="undefined" disabled selected>
                  Select a country
                </option>
                <option
                  [ngValue]="country.id"
                  *ngFor="let country of countries"
                >
                  {{ country.name }}
                </option>
              </select>
              <div
                *ngIf="country.invalid && (f.submitted || country.touched)"
                class="invalid-feedback text-break"
              >
                <div *ngIf="country.errors?.required">
                  Please select a valid country.
                </div>
              </div>
            </div>
          </div>

          <div class="col-sm-4 mb-3">
            <div class="form-group">
              <label class="form-label required" for="state">State:</label>
              <select
                class="form-select"
                name="state"
                id="state"
                (change)="onChangeState()"
                [(ngModel)]="property.stateId"
                [ngClass]="{
                  'is-invalid': state.invalid && (f.submitted || state.touched)
                }"
                required
                #state="ngModel"
                ngModel
              >
                <option [ngValue]="undefined" disabled selected>
                  Select a state
                </option>
                <option [ngValue]="state.id" *ngFor="let state of states">
                  {{ state.name }}
                </option>
              </select>
              <div
                *ngIf="state.invalid && (f.submitted || state.touched)"
                class="invalid-feedback text-break"
              >
                <div *ngIf="state.errors?.required">
                  Please select a valid state.
                </div>
              </div>
            </div>
          </div>

          <div class="col-sm-4 mb-3">
            <div class="form-group">
              <label class="form-label required" for="city">City:</label>
              <select
                class="form-select"
                name="city"
                id="city"
                [(ngModel)]="property.cityId"
                [ngClass]="{
                  'is-invalid': city.invalid && (f.submitted || city.touched)
                }"
                required
                #city="ngModel"
                ngModel
              >
                <option [ngValue]="undefined" disabled selected>
                  Select a city
                </option>
                <option [ngValue]="city.id" *ngFor="let city of cities">
                  {{ city.name }}
                </option>
              </select>
              <div
                *ngIf="city.invalid && (f.submitted || city.touched)"
                class="invalid-feedback text-break"
              >
                <div *ngIf="city.errors?.required">
                  Please select a valid city.
                </div>
              </div>
            </div>
          </div>

          <div class="col-sm-6 mb-3">
            <div class="form-group">
              <label class="form-label required" for="ownerName"
                >Owner Name:</label
              >
              <input
                type="text"
                class="form-control"
                name="ownerName"
                id="ownerName"
                [ngClass]="{
                  'is-invalid':
                    ownerName.invalid && (f.submitted || ownerName.touched)
                }"
                [(ngModel)]="property.ownerName"
                placeholder="Enter owner name"
                required
                #ownerName="ngModel"
                maxlength="255"
                ngModel
              />
              <div
                *ngIf="ownerName.invalid && (f.submitted || ownerName.touched)"
                class="invalid-feedback text-break"
              >
                <div *ngIf="ownerName.errors?.required">
                  Please enter a valid owner name.
                </div>
              </div>
            </div>
          </div>

          <div class="col-sm-6 mb-3">
            <div class="form-group">
              <label class="form-label" for="description">Description:</label>
              <textarea
                class="form-control"
                rows="2"
                name="description"
                id="description"
                [(ngModel)]="property.description"
                placeholder="Enter description"
              ></textarea>
            </div>
          </div>
        </div>

        <div class="row" [hidden]="!isLoading">
          <div class="col-12">
            <app-is-loading [isFormStateEdit]="true"></app-is-loading>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn me-auto"
          (click)="cancel()"
          [disabled]="isLoading"
          data-bs-dismiss="modal"
        >
          <i class="far fa-window-close pe-1"></i>
          Close
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isLoading"
          data-bs-dismiss="modal"
        >
          <i
            *ngIf="isLoading"
            class="spinner-border spinner-border-sm me-1"
          ></i>
          <i
            *ngIf="!isLoading && formState === 'EDIT'"
            class="fas fa-edit pe-1"
          ></i>
          <i
            *ngIf="!isLoading && formState !== 'EDIT'"
            class="far fa-save pe-1"
          ></i>
          {{ formState === "EDIT" ? "Update" : "Save" }}
        </button>
        <button
          class="btn btn-vk"
          type="button"
          (click)="f.submitted = true; f.form.valid && saveAndAddMore()"
          *ngIf="formState === 'NEW'"
          [disabled]="isLoading"
        >
          <i *ngIf="isLoading" class="spinner-border spinner-border-sm me-1"></i
          ><i *ngIf="!isLoading" class="fas fa-folder-plus pe-1"></i>
          Save & Add More
        </button>
      </div>
    </form>
  </div>
</div>
