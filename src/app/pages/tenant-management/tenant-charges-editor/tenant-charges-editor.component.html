<div class="modal-content">
  <div class="container-fluid p-0">
    <form #f="ngForm">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas fa-file-invoice-dollar me-2"></i>
          Tenant Charges Editor
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
          (click)="cancel()"
          aria-hidden="true"
        >
          &times;
        </button>
      </div>
      <div class="modal-body p-3">
        <div class="row">
          <div class="col-12">
            <small class="form-text text-muted">
              <strong>Note:</strong> Please select a record in the first grid to
              display the details in the second grid.
            </small>
          </div>
          <div class="col-sm-12 mt-2">
            <h3 class="mb-2">Rent Head Summary:</h3>
            <ag-grid-angular
              style="width: 100%; height: 28vh;"
              class="ag-theme-alpine"
              [enableCellTextSelection]="true"
              [columnDefs]="gridColumnDefsChargesSummary"
              [rowData]="gridRowDataChargesSummary"
              [pinnedBottomRowData]="gridPinnedBottomRowDataChargesSummary"
              [rowSelection]="'single'"
              (gridReady)="onChargesSummaryGridReady($event)"
              (selectionChanged)="onChargesSummarySelectionChanged()"
              [defaultColDef]="defaultColDef"
            >
            </ag-grid-angular>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-12">
            <h3 class="mb-2">Detailed Rent Structure:</h3>
            <ag-grid-angular
              style="width: 100%; height: 28vh;"
              class="ag-theme-alpine"
              [enableCellTextSelection]="true"
              [columnDefs]="gridColumnDefsDueDates"
              [rowData]="gridRowDataDueDates"
              [rowSelection]="'single'"
              (gridReady)="onDueDatesGridReady($event)"
              [defaultColDef]="defaultColDef"
            >
            </ag-grid-angular>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn me-auto"
          (click)="cancel()"
          data-bs-dismiss="modal"
        >
          <i class="far fa-window-close pe-1"></i>
          Close
        </button>
      </div>
    </form>
  </div>
</div>
