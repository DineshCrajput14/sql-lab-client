<div class="modal-content">
  <div class="container-fluid p-0">
    <form #f="ngForm" (ngSubmit)="f.form.valid && save()" autocomplete="off">
      <div class="modal-header py-2">
        <h5 class="modal-title">
          <i class="fa fa-md fas fa-user-plus pe-1"></i>
          {{ formState === "EDIT" ? "Edit" : "New" }} Tenant
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
          [disabled]="isLoading"
          (click)="cancel()"
          aria-hidden="true"
        >
          &times;
        </button>
      </div>
      <div class="modal-body py-2">
        <div class="row" [hidden]="isLoading">
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label mb-1" for="tenantRegNo">Reg. No:</label>
              <input
                type="text"
                class="form-control"
                name="tenantRegNo"
                id="tenantRegNo"
                [(ngModel)]="tenant.regNo"
                [disabled]="formState === 'EDIT' || isRegNoAuto"
                placeholder="Enter registration number"
              />
            </div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label required mb-1" for="tenantRegDate"
                >Reg. Date:</label
              >
              <input
                type="text"
                class="form-control"
                name="tenantRegDate"
                id="tenantRegDate"
                [(ngModel)]="tenant.regDate"
                required
                #tenantRegDate="ngModel"
                [ngClass]="{
                  'is-invalid':
                    tenantRegDate.invalid &&
                    (f.submitted || tenantRegDate.touched)
                }"
                placeholder="DD-MM-YYYY"
                bsDatepicker
                autocomplete="off"
                [outsideClick]="true"
                [container]="'body'"
                [bsConfig]="{
                  dateInputFormat: 'DD-MM-YYYY',
                  isAnimated: true,
                  containerClass: 'theme-dark-blue',
                  returnFocusToInput: true,
                  showWeekNumbers: false
                }"
              />
              <div
                class="invalid-feedback text-break"
                *ngIf="
                  tenantRegDate.invalid &&
                  (f.submitted || tenantRegDate.touched)
                "
              >
                <div *ngIf="tenantRegDate.errors?.required">
                  Please enter a valid registration date.
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label required mb-1" for="tenantName"
                >Tenants Name:</label
              >
              <input
                type="text"
                class="form-control"
                name="tenantName"
                id="tenantName"
                [(ngModel)]="tenant.name"
                placeholder="Enter tenant name"
                required
                #tenantName="ngModel"
                [ngClass]="{
                  'is-invalid':
                    tenantName.invalid && (f.submitted || tenantName.touched)
                }"
              />
              <div
                class="invalid-feedback text-break"
                *ngIf="
                  tenantName.invalid && (f.submitted || tenantName.touched)
                "
              >
                <div *ngIf="tenantName.errors?.required">
                  Please enter a valid tenant name.
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label mb-1" for="tenantMobileNo"
                >Mobile No:</label
              >
              <input
                type="text"
                class="form-control"
                name="tenantMobileNo"
                id="tenantMobileNo"
                [(ngModel)]="tenant.mobileNo"
                placeholder="Enter mobile number"
                maxlength="15"
                #tenantMobileNo="ngModel"
              />
            </div>
          </div>
          <div class="col-md-8 mb-2">
            <div class="form-group">
              <label class="form-label mb-1" for="tenantAddress"
                >Address:</label
              >
              <input
                type="text"
                class="form-control"
                name="tenantAddress"
                id="tenantAddress"
                [(ngModel)]="tenant.address"
                placeholder="Enter address"
              />
            </div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label mb-1" for="tenantCountry"
                >Country:</label
              >
              <select
                class="form-select"
                name="tenantCountry"
                id="tenantCountry"
                [(ngModel)]="tenant.countryId"
                (change)="onChangeCountry()"
              >
                <option [ngValue]="undefined" disabled selected
                  >Select country</option
                >
                <option
                  *ngFor="let country of countries"
                  [ngValue]="country.id"
                >
                  {{ country.name }}
                </option>
              </select>
            </div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label mb-1" for="tenantState">State:</label>
              <select
                class="form-select"
                name="tenantState"
                id="tenantState"
                [(ngModel)]="tenant.stateId"
                (change)="onChangeState()"
                [disabled]="!tenant.countryId"
              >
                <option [ngValue]="undefined" disabled selected
                  >Select state</option
                >
                <option *ngFor="let state of states" [ngValue]="state.id">
                  {{ state.name }}
                </option>
              </select>
            </div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label mb-1" for="tenantCity">City:</label>
              <select
                class="form-select"
                name="tenantCity"
                id="tenantCity"
                [(ngModel)]="tenant.cityId"
                [disabled]="!tenant.stateId"
              >
                <option [ngValue]="undefined" disabled selected
                  >Select city</option
                >
                <option *ngFor="let city of cities" [ngValue]="city.id">
                  {{ city.name }}
                </option>
              </select>
            </div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label mb-1" for="tenantIdentityProof"
                >Identity Proof:</label
              >
              <select
                class="form-select"
                name="tenantIdentityProof"
                id="tenantIdentityProof"
                [(ngModel)]="tenant.identityProof"
              >
                <option
                  *ngFor="let proof of identityProofTypes"
                  [value]="proof"
                >
                  {{ proof }}
                </option>
              </select>
            </div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label mb-1" for="tenantProofNumber">
                {{
                  tenant.identityProof
                    ? tenant.identityProof + " No:"
                    : "ID Proof No:"
                }}
              </label>
              <input
                type="text"
                class="form-control"
                name="tenantProofNumber"
                id="tenantProofNumber"
                [(ngModel)]="tenant.identityProofNumber"
                [placeholder]="
                  'Enter ' + (tenant.identityProof || 'ID') + ' number'
                "
              />
            </div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="row g-2">
              <div
                [ngClass]="tenant.status === 'Inactive' ? 'col-6' : 'col-12'"
              >
                <div class="form-group">
                  <label class="form-label required mb-1" for="tenantStatus"
                    >Status:</label
                  >
                  <select
                    class="form-select"
                    name="tenantStatus"
                    id="tenantStatus"
                    [(ngModel)]="tenant.status"
                    (change)="onChangeStatus()"
                    required
                  >
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                  </select>
                </div>
              </div>
              <div class="col-6" *ngIf="tenant.status === 'Inactive'">
                <div class="form-group">
                  <label class="form-label mb-1" for="tenantInactiveDate"
                    >Inactive Date:</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    name="tenantInactiveDate"
                    id="tenantInactiveDate"
                    [(ngModel)]="tenant.inactiveDate"
                    placeholder="DD-MM-YYYY"
                    bsDatepicker
                    autocomplete="off"
                    [outsideClick]="true"
                    [container]="'body'"
                    [bsConfig]="{
                      dateInputFormat: 'DD-MM-YYYY',
                      isAnimated: true,
                      containerClass: 'theme-dark-blue',
                      returnFocusToInput: true,
                      showWeekNumbers: false
                    }"
                  />
                </div>
              </div>
            </div>
          </div>
          <div class="col-12 my-1">
            <h3 class="mb-0 text-primary fw-bold">
              <i class="fas fa-users-cog pe-1"></i> Next of Kin Details
            </h3>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label mb-1" for="nextOfKinName"
                >Next of Kin Name:</label
              >
              <input
                type="text"
                class="form-control"
                name="nextOfKinName"
                id="nextOfKinName"
                [(ngModel)]="tenant.nextOfKinName"
                placeholder="Enter next of kin name"
              />
            </div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label mb-1" for="nextOfKinMobile"
                >Mobile No:</label
              >
              <input
                type="text"
                class="form-control"
                name="nextOfKinMobile"
                id="nextOfKinMobile"
                [(ngModel)]="tenant.nextOfKinMobileNo"
                placeholder="Enter mobile number"
                maxlength="15"
              />
            </div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group">
              <label class="form-label mb-1" for="nextOfKinAddress"
                >Address:</label
              >
              <input
                type="text"
                class="form-control"
                name="nextOfKinAddress"
                id="nextOfKinAddress"
                [(ngModel)]="tenant.nextOfKinAddress"
                placeholder="Enter address"
                maxlength="255"
              />
            </div>
          </div>
        </div>
        <div class="row" *ngIf="isLoading">
          <div class="col-12 text-center py-4">
            <app-is-loading></app-is-loading>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn me-auto"
          (click)="cancel()"
          [disabled]="isLoading"
          data-bs-dismiss="modal"
        >
          <i class="far fa-window-close pe-1"></i>
          Close
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading">
          <i
            *ngIf="isLoading"
            class="spinner-border spinner-border-sm me-1"
          ></i>
          <i
            *ngIf="!isLoading && formState === 'EDIT'"
            class="fas fa-edit pe-1"
          ></i>
          <i
            *ngIf="!isLoading && formState !== 'EDIT'"
            class="far fa-save pe-1"
          ></i>
          {{ formState === "EDIT" ? "Update" : "Save" }}
        </button>
        <button
          class="btn btn-vk"
          type="button"
          (click)="f.submitted = true; f.form.valid && saveAndAddMore()"
          *ngIf="formState === 'NEW'"
          [disabled]="isLoading"
        >
          <i
            *ngIf="isLoading"
            class="spinner-border spinner-border-sm me-1"
          ></i>
          <i *ngIf="!isLoading" class="fas fa-folder-plus pe-1"></i>
          Save & Add More
        </button>
      </div>
    </form>
  </div>
</div>
