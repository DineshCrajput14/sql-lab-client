<div class="container-fluid">
  <div class="row mb-3">
    <div class="col-md-8">
      <h4>Patient Titles</h4>
    </div>
  </div>

  <div *ngIf="isLoading" class="text-center p-3">
    Loading Patient Titles...
  </div>

  <ag-grid-angular
    *ngIf="!isLoading"
    class="ag-theme-alpine"
    style="width: 100%; height: 400px;"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [pagination]="true"
    [paginationPageSize]="10"
    [defaultColDef]="{
      sortable: true,
      filter: true,
      resizable: true
    }"
    (cellClicked)="onCellClicked($event)"
  >
  </ag-grid-angular>

  <div class="row mt-3">
    <div class="col-md-4">
      <div class="fw-bold mb-2">Total Records: {{ rowData.length }}</div>

      <button type="button" class="btn btn-primary" (click)="addTitle()">
        Add Title
      </button>
    </div>
  </div>
</div>
