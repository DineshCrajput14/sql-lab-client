<div class="page-header d-print-none mt-1">
  <div class="container-xl p-0 pb-2">
    <div class="row g-2 align-items-center">
      <div class="col">
        <h2 class="page-title">
          Settings
        </h2>
      </div>
    </div>
  </div>
</div>
<div class="page-body mt-2">
  <div class="container-xl p-0">
    <form
      #f="ngForm"
      (ngSubmit)="f.form.valid && confirmSave()"
      autocomplete="off"
    >
      <div class="card">
        <div class="card-header py-2">
          <h3 class="card-title mb-0">
            <i class="fas fa-users-cog pe-1 text-primary"></i> Tenant
            Registration
          </h3>
        </div>
        <div class="card-body py-3">
          <div *ngIf="isLoading" class="text-center py-3">
            <app-is-loading></app-is-loading>
          </div>
          <div *ngIf="!isLoading" class="row align-items-center">
            <div class="col-sm-auto pe-4">
              <div class="form-check mb-0">
                <input
                  type="checkbox"
                  id="tenantRegistrationNumberAuto"
                  class="form-check-input"
                  name="tenantRegistrationNumberAuto"
                  [(ngModel)]="controlPanel.tenantRegistrationNumberAuto"
                  #tenantRegistrationNumberAuto="ngModel"
                />
                <label
                  class="form-check-label fw-bold cursor-pointer"
                  for="tenantRegistrationNumberAuto"
                >
                  Registration Number Auto
                </label>
              </div>
            </div>
            <div
              class="col-sm-auto"
              *ngIf="controlPanel.tenantRegistrationNumberAuto"
            >
              <div class="d-flex align-items-center">
                <label
                  class="col-form-label required fw-bold me-2 text-nowrap mb-0"
                  for="nextNumberTenant"
                >
                  Next Registration Number:
                </label>
                <div style="width: 170px;">
                  <input
                    type="text"
                    class="form-control"
                    name="nextNumberTenant"
                    id="nextNumberTenant"
                    [(ngModel)]="nextNumber.nextNumberTenant"
                    placeholder="Enter next reg. no"
                    NumbersOnlyDirective
                    maxlength="10"
                    [required]="controlPanel.tenantRegistrationNumberAuto"
                    #nextNumberTenant="ngModel"
                    [ngClass]="{
                      'is-invalid':
                        nextNumberTenant.invalid &&
                        (f.submitted || nextNumberTenant.touched)
                    }"
                  />
                </div>
              </div>
              <div
                *ngIf="
                  nextNumberTenant.invalid &&
                  (f.submitted || nextNumberTenant.touched)
                "
                class="invalid-feedback d-block text-break"
              >
                <div *ngIf="nextNumberTenant.errors?.required">
                  Please enter a valid next registration number.
                </div>
              </div>
            </div>
          </div>
        </div>
        <div
          class="card-footer py-2 d-flex justify-content-end"
          *ngIf="!isLoading"
        >
          <button type="submit" class="btn btn-primary" [disabled]="isLoading">
            <i
              *ngIf="isLoading"
              class="spinner-border spinner-border-sm me-1"
            ></i>
            <i *ngIf="!isLoading" class="far fa-save pe-1"></i>
            Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
