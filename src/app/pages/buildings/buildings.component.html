<div class="page-header d-print-none mt-1">
  <div class="container-xl p-0 pb-2">
    <div class="row g-2 align-items-center">
      <div class="col">
        <h2 class="page-title">
          Building
        </h2>
      </div>
    </div>
  </div>
</div>
<section class="content">
  <div class="container-fluid p-0">
    <form #f="ngForm">
      <div class="row mb-3 form-group">
        <label class="col-1 col-form-label required" for="property"
          >Property:</label
        >
        <div class="col-sm-3">
          <select
            class="form-select"
            name="property"
            id="property"
            [(ngModel)]="search.propertyId"
            [ngClass]="{
              'is-invalid':
                property.invalid && (f.submitted || property.touched)
            }"
            required
            #property="ngModel"
            (change)="getBuildings()"
          >
            <option [ngValue]="undefined" disabled selected>
              Select a property
            </option>
            <option [ngValue]="property.id" *ngFor="let property of properties">
              {{ property.name }}
            </option>
          </select>
          <div
            *ngIf="property.invalid && (f.submitted || property.touched)"
            class="invalid-feedback text-break"
          >
            <div *ngIf="property.errors?.required">
              Please select a valid property.
            </div>
          </div>
        </div>
      </div>
      <div
        class="row"
        *ngIf="!(gridRowDataBuildings || []).length && isLoading"
      >
        <app-is-loading></app-is-loading>
      </div>
      <div
        class="row"
        *ngIf="!(gridRowDataBuildings || []).length && !isLoading"
      >
        <div class="col-12">
          <div class="d-flex justify-content-center align-items-center">
            <app-no-record-found-image
              [masterName]="'Building'"
            ></app-no-record-found-image>
          </div>
        </div>
      </div>
      <div
        class="row"
        *ngIf="!isLoading && (gridRowDataBuildings || []).length"
      >
        <div class="col-12">
          <ag-grid-angular
            style="width: 100%; height: 55vh;"
            class="ag-theme-alpine"
            [enableCellTextSelection]="true"
            (gridReady)="onGridReady($event)"
            (filterChanged)="onFilterChanged($event)"
            [columnDefs]="gridColumnDefsBuildings"
            [rowData]="gridRowDataBuildings"
            [defaultColDef]="defaultColDef"
          >
          </ag-grid-angular>
          <div *ngIf="gridRowDataBuildings?.length" class="ms-1 fw-bold mt-2">
            <label>Total records: {{ rowCount }}</label>
          </div>
        </div>
      </div>
      <div class="row p-1 my-2">
        <div class="col-12">
          <button
            type="button"
            (click)="newBuildingModal()"
            [disabled]="!search.propertyId"
            class="btn btn-primary me-2"
          >
            <i class="fas fa-building pe-1"></i>Add Building
          </button>
        </div>
      </div>
    </form>
  </div>
</section>
