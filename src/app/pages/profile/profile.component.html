<div class="page-header d-print-none mt-3">
  <div class="container-xl p-0 pb-2">
    <div class="row g-2 align-items-center">
      <div class="col">
        <h2 class="page-title">
          Profile
        </h2>
      </div>
    </div>
  </div>
</div>
<section class="content display-profile">
  <div class="container-fluid p-0">
    <div class="row">
      <div class="col-md-5 col-lg-3 mb-2">
        <div class="card card-primary card-outline">
          <div class="card-body box-profile">
            <div class="text-center">
              <img
                class="avatar avatar-2xl rounded"
                [src]="
                  authService.authentication?.user?.imageUrl ||
                  'assets/img/team.png'
                "
                alt="User profile picture"
              />
            </div>
            <h3 class="text-center mt-2">
              {{ authService.authentication?.user?.name || "Admin" }}
            </h3>
          </div>
        </div>
      </div>
      <div class="vol-md-7 col-lg-9">
        <div class="card">
          <div class="card-body">
            <dl class="row mb-0">
              <dt class="col-lg-3 col-md-4 col-6">
                Name
              </dt>
              <dd class="col-lg-9 col-md-8 col-6">
                : {{ authService.authentication?.user?.name }}
              </dd>
              <dt class="col-lg-3 col-md-4 col-6">
                Mobile No.
              </dt>
              <dd class="col-lg-9 col-md-8 col-6">
                : {{ authService.authentication?.user?.mobileNo }}
              </dd>
            </dl>
            <dl class="row mt-2">
              <dt class="col-lg-3 col-md-4 col-6">
                Password
              </dt>
              <dd class="col-lg-9 col-md-8 col-6">
                :
                <button
                  type="button"
                  class="btn btn-primary p-1 px-2"
                  (click)="onChangePassword()"
                >
                  <i class="fas fa-cog pe-1"></i> Change Password
                </button>
              </dd>
            </dl>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
